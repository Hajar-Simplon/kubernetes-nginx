apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment

  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: nginx
    app.kubernetes.io/version: "1.33"
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: kubernetes-nginx
    app.kubernetes.io/managed-by: kubectl

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/instance: nginx
        app.kubernetes.io/version: "1.33"
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: kubernetes-nginx
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80